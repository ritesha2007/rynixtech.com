<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rynix Tech - Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:340px;
    padding:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition: 0.3s;
}

button:hover{
    transform: scale(1.02);
    box-shadow: 0 0 10px #FFD700;
}

button:disabled{
    opacity: 0.6;
    cursor: not-allowed;
}

a{
    color:#FFD700;
    text-decoration:none;
}

.message{
    margin-top: 10px;
    font-size: 14px;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="box">

<h1>Rynix Tech</h1>
<h3>Login</h3>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn" onclick="loginUser()">Login</button>

<div class="message" id="message"></div>

<p>
Don't have an account?
<a href="index.html">Go Back</a> | <a href="signup.html">Sign Up</a>
</p>

<p>
<a href="#" onclick="resetPass()">Forgot Password?</a>
</p>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

window.loginUser = async function(){
  
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const messageDiv = document.getElementById("message");

  if (!email || !password) {
    messageDiv.style.color = "red";
    messageDiv.textContent = "Please fill in all fields";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    
    messageDiv.style.color = "green";
    messageDiv.textContent = "Login successful! Redirecting...";
    
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1500);

  } catch (error) {
    messageDiv.style.color = "red";
    messageDiv.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "Login";
  }
}

window.resetPass = function(){
  const email = prompt("Enter your email:");
  if (email) {
    sendPasswordResetEmail(auth, email)
      .then(() => {
        alert("Password reset email sent!");
      })
      .catch(error => {
        alert(error.message);
      });
  }
}

</script>

</body>
</html>
