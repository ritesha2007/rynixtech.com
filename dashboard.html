<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rynix Tech Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:360px;
    padding:30px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="box">
<h1>Welcome to Rynix Tech</h1>

<p id="userEmail">Loading...</p>

<button onclick="logout()">Logout</button>
</div>

<script type="module">

import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import "./auth.js";

onAuthStateChanged(auth,(user)=>{

if(user){
document.getElementById("userEmail").textContent=user.email;
}else{
window.location.href="login.html";
}

});

</script>

</body>
</html>
