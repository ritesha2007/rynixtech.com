<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rynix Tech - Sign Up</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:340px;
    padding:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition: 0.3s;
}

.google-btn{ background:#4285F4; color:#fff; margin-top:12px }

button:hover{
    transform: scale(1.02);
    box-shadow: 0 0 10px #FFD700;
}

button:disabled{
    opacity: 0.6;
    cursor: not-allowed;
}

a{
    color:#FFD700;
    text-decoration:none;
}

.message{
    margin-top: 10px;
    font-size: 14px;
    min-height: 20px;
}
</style>
</head>

<body>

<div class="box">

<h1>Rynix Tech</h1>
<h3>Create Account</h3>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="signupBtn" onclick="signupUser()">Create Account</button>

<button id="googleBtn" class="google-btn" onclick="googleLogin()">Continue with Google</button>

<div class="message" id="message"></div>

<p>
Already have an account?
<a href="index.html">Go Back</a> | <a href="login.html">Login</a>
</p>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  setPersistence,
  browserLocalPersistence,
  createUserWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

// Redirect if already signed in and verified
onAuthStateChanged(auth, (user) => {
  if (user) {
    if (user.emailVerified) {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('verify.html');
    }
  }
});

window.signupUser = async function(){
  
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("signupBtn");
  const messageDiv = document.getElementById("message");

  if (!email || !password) {
    messageDiv.style.color = "red";
    messageDiv.textContent = "Please fill in all fields";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Creating...";

  try {
    // Persist the session
    await setPersistence(auth, browserLocalPersistence);

    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // Save user document in Firestore using server timestamp
    await setDoc(doc(db, "users", user.uid), {
      email: user.email,
      role: "user",
      createdAt: serverTimestamp()
    }, { merge: true });

    // Send verification email
    await sendEmailVerification(user);

    messageDiv.style.color = "green";
    messageDiv.textContent = "Account created. Verification email sent — check your inbox.";
    
    // redirect to verification page
    window.location.replace("verify.html");

  } catch (error) {
    console.error('Signup error:', error);
    messageDiv.style.color = "red";
    messageDiv.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "Create Account";
  }
}

// googleLogin is provided in auth.js (global function)

</script>

</body>
</html>
